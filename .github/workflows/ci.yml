on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: CI

permissions: {}

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      matrix:
        rust:
          - 1.81.0
    steps:
      - name: Check out repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f # v1.0.6
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Run Clippy
        run: rustup run ${{ matrix.rust }} cargo clippy --all --all-targets --all-features -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      matrix:
        rust:
          # Once we settle on a MSRV we should add that here.
          - 1.81.0
    steps:
      - name: Check out repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f # v1.0.6
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          components: rustfmt

      - name: Run Rustfmt
        run: rustup run ${{ matrix.rust}} cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      matrix:
        rust:
          # Once we settle on a MSRV we should add that here.
          - 1.81.0
    steps:
      - name: Check out repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f # v1.0.6
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}

      - name: Run tests
        run: rustup run ${{ matrix.rust }} cargo test --all-features

  typeshare:
    name: Typeshare
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      matrix:
        rust:
          - 1.81.0
        lang:
          - typescript
          - kotlin
          - swift
        include:
          - fs: ts
            lang: typescript
          - fs: kt
            lang: kotlin
          - fs: swift
            lang: swift
    steps:
      - name: Check out repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@02be93da58aa71fb456aa9c43b301149248829d8 # v1.15.1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install Typeshare
        uses: clechasseur/rs-cargo@bbcc0f43bb19de578aed0eaf1211970155d0fbcd # v4.0.0
        with:
          command: install
          args: --version 1.7.0 --locked typeshare-cli

      - name: Run Typeshare
        run: typeshare --lang=${{ matrix.lang }} . -o test.${{ matrix.fs }}
